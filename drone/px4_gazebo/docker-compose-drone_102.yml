
networks:
  drone_102_net:
    external: true

  swarm_net:
    external: true

services:

  envoy_102:
    image: envoyproxy/envoy:v1.23-latest
    container_name: envoy_102
    volumes:
      - ./envoy/drone_102.yml:/etc/envoy/envoy.yaml
    ports:
      - "5200:8000"
      - "5201:8001"
    networks:
      drone_102_net:
        ipv4_address: 192.168.102.2

  opa_102:
    image: openpolicyagent/opa:latest-envoy
    container_name: opa_102
    volumes:
      - ./opa/policy.rego:/policy/policy.rego
    command:
      - run
      - --server
      - --log-level=debug
      - --log-format=json-pretty
      - --addr=0.0.0.0:8181
      - --set=plugins.envoy_ext_authz_grpc.addr=:9191
      - --set=decision_logs.console=true
      - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow
      - /policy/policy.rego
    ports:
      - "8181:8181"
    networks:
      drone_102_net:
        ipv4_address: 192.168.102.3

  drone_102:
    image: hongtringuyen/gazebo_sim_px4 
    container_name: drone_102
    networks:
      swarm_net:
        ipv4_address: 192.168.132.102
      drone_102_net:
        ipv4_address: 192.168.102.102
    volumes:
      - ./configs/drone_102.yml:/root/.config/tmuxinator/px4_ros2_gazebo.yml
    environment:
      GZ_PARTITION: "relay"
      GZ_IP: "192.168.132.1"
      PX4_MODEL: "gz_x500"
    #command: ["/bin/bash", "-c", "tmuxinator start -p /root/.config/tmuxinator/px4_ros2_gazebo.yml"]
    command: ["tmuxinator", "start", "px4_ros2_gazebo.yml"]

  swarm_102:
    image: hello-world 
    container_name: swarm_102
    networks:
      swarm_net:
        ipv4_address: 192.168.132.112
    volumes:
      - ./configs/drone_102.yml:/root/.config/tmuxinator/px4_ros2_gazebo.yml
    environment:
      GZ_PARTITION: "relay"
      GZ_IP: "192.168.132.1"
      PX4_MODEL: "gz_x500"
    #command: ["/bin/bash", "-c"] # , "tmuxinator start -p /root/.config/tmuxinator/px4_ros2_gazebo.yml"]

  ros2_102:
    image: ros:humble-ros-base-jammy 
    container_name: ros2_102
    networks:
      drone_102_net:
        ipv4_address: 192.168.102.4
    # volumes:
    #   - ./configs/drone_102.yml:/root/.config/tmuxinator/px4_ros2_gazebo.yml
    # environment:
    #   GZ_PARTITION: "relay"
    #   GZ_IP: "192.168.132.1"
    #   PX4_MODEL: "gz_x500"
    command: ["/bin/bash", "-c"] # , "tmuxinator start -p /root/.config/tmuxinator/px4_ros2_gazebo.yml"]

