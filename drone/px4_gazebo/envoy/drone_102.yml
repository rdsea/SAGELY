static_resources:
  listeners:
    - address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains:
                        - ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: service
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        provider_azad:
                          issuer: https://login.microsoftonline.com/<TenantID>/v2.0
                          audiences: <ClientID>
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: "https://login.microsoftonline.com/<TenantID>/discovery/v2.0/keys"
                              cluster: azad
                              timeout: 10s
                            cache_duration:
                              seconds: 600
                      rules:
                        - match:
                            prefix: /health
                        - match:
                            prefix: /common
                          requires:
                            provider_and_audiences:
                              provider_name: provider_azad
                              audiences: <ClientID>
                        - match:
                            prefix: /workspaces
                          requires:
                            provider_and_audiences:
                              provider_name: provider_azad
                              audiences: <ClientID>
                  - name: envoy.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc:
                          cluster_name: envoy.ext_authz
                        timeout: 0.5s
                        # google_grpc:
                        #   target_uri: 192.168.102.3:9191
                        #   stat_prefix: ext_authz
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: service
      connect_timeout: 0.25s
      type: strict_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.102.102
                      port_value: 8080
    - name: envoy.ext_authz
      connect_timeout: 0.25s
      type: strict_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.102.3
                      port_value: 9191
    - name: azad
      connect_timeout: 100s
      type: strict_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: azad
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: login.microsoftonline.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: login.microsoftonline.com
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8001
layered_runtime:
  layers:
    - name: static_layer_0
      static_layer:
        envoy:
          resource_limits:
            listener:
              example_listener_name:
                connection_limit: 10000
        overload:
          global_downstream_max_connections: 50000
