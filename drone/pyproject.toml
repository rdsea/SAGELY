[project]
name = "ros-simulation"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "hong3nguyen", email = "tringuyennht@gmail.com" }]
dependencies = [
  "setuptools>=75.3.0",
  "empy==3.3.4",
  "lark>=1.2.2",
  "fastapi[standard]>=0.115.4",
  "requests>=2.32.3",
  "colcon-common-extensions>=0.3.0",
  "aiohttp>=3.11.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ros_simulation"]
