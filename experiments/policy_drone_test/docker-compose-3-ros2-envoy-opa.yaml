    command:
      - run
      - --server
      - --log-level=debug
      - --log-format=json-pretty
      - --addr=0.0.0.0:8182
      - --set=plugins.envoy_ext_authz_grpc.addr=:9192
      - --set=decision_logs.console=true
      - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow
      - /policy/policy.rego
    ports:
      - "8182:8181"

  drone2:
    image: hongtringuyen/drone_ros2
    container_name: drone2
    network_mode: host
    stdin_open: true
    tty: true
    #volumes:
    # - /u/42/nguyent141/unix/Public/git/holisticPolicy/object_classification/src/artifact/dataset/imagenet/data/val_images:/root/drone/src/data/val_images
    command: ["/bin/bash"]
    #command: ["../scripts/entrypoint_etcd.sh 2"]
    ports:
      - "14571:14571/udp"
      - "14580:14580/udp"

  envoy2:
    image: envoyproxy/envoy:v1.23-latest
    container_name: envoy2
    volumes:
      - ./envoy/config.yaml:/etc/envoy/envoy.yaml
    ports:
      - "5204:8000"
      - "5205:8001"

  opa2:
    image: openpolicyagent/opa:latest-envoy
    container_name: opa2
    volumes:
      - ./opa/policy.rego:/policy/policy.rego
    command:
      - run
      - --server
      - --log-level=debug
      - --log-format=json-pretty
      - --addr=0.0.0.0:8183
      - --set=plugins.envoy_ext_authz_grpc.addr=:9193
      - --set=decision_logs.console=true
      - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow
