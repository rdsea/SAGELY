apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app: istio-ingressgateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32052
      name: http
    - port: 443
      targetPort: 443
      nodePort: 32053
      name: https
    - port: 15021
      targetPort: 15021
      nodePort: 31208
      name: tcp-status-port
    - port: 31400
      targetPort: 31400
      nodePort: 30547
      name: tcp-istio-policy
    - port: 15443
      targetPort: 15443
      nodePort: 32282
      name: tcp-istio-ingressgateway
