apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: preprocessing-vs
spec:
  hosts:
  - preprocessing-service
  http:
  - route:
    - destination:
        host: preprocessing-service
        subset: v1
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 10s
---
