[project]
name = "application-testing"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "hong3nguyen", email = "tringuyennht@gmail.com" }
]
dependencies = [
    "etcd3>=0.12.0",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "protobuf>=5.29.3",
    "requests>=2.32.3",
    "redis>=5.2.1",
]
# readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/application_testing"]
