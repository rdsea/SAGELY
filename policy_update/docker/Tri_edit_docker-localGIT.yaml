version: "3.7"
services:
  # broadcast_channel:
  #   image: postgres:alpine
  #   environment:
  #     - POSTGRES_DB=postgres
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  opal_server:
    image: permitio/opal-server:latest
    environment:
      # - OPAL_BROADCAST_URI=postgres://postgres:postgres@broadcast_channel:5432/postgres
      # for clinet opal
      - UVICORN_NUM_WORKERS=1
      #- OPAL_POLICY_REPO_POLLING_INTERVAL=30
      #- OPAL_POLICY_REPO_URL=http://tri:tritritri@0.0.0.0/tri/rego_git.git/main
      #- OPAL_POLICY_REPO_AUTH_USER=tri
      #- OPAL_POLICY_REPO_AUTH_PASS=tritritri # Update with your GitLab root password
      - OPAL_POLICY_REPO_MAIN_BRANCH=main
      - OPAL_POLICY_REPO_URL=http://localhost/tri/rego_git.git
      - OPAL_LOG_FORMAT_INCLUDE_PID=true
      - OPAL_DATA_CONFIG_SOURCES={"config":{"entries":[{"url":"http://localhost:7002/policy-data","topics":["policy_data"],"dst_path":"/static"}]}}
      - OPAL_POLICY_REPO_WEBHOOK_SECRET=tritritri
      #- OPAL_POLICY_REPO_WEBHOOK_PARAMS={"secret_header_name":"x-webhook-token","secret_type":"token","secret_parsing_regex":"(.*)","event_request_key":"gitEvent","push_event_value":"git.push"}
      - OPAL_POLICY_REPO_WEBHOOK_PARAMS={"secret_header_name":"X-Gitlab-Token","secret_type":"token","secret_parsing_regex":"(.*)","event_header_name":"X-Gitlab-Event","push_event_value":"Push Hook"}
    ports:
      - "7002:7002"
    # depends_on:
    #   - broadcast_channel
    network_mode: host

  opal_client:
    image: permitio/opal-client:latest
    environment:
      - OPAL_SERVER_URL=http://localhost:7002
      - OPAL_LOG_FORMAT_INCLUDE_PID=true
      - OPAL_INLINE_OPA_LOG_FORMAT=http
    ports:
      - "7766:7000"
      - "8181:8181"
    depends_on:
      - opal_server
    command: sh -c "exec ./wait-for.sh localhost:7002 --timeout=20 -- ./start.sh"
    network_mode: host
