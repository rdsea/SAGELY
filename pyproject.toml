[project]
name = "sagely"
version = "0.1.0"
description = "SAGELY framework"
authors = [{ name = "AaltoSEA team", email = "tringuyennht@gmail.com, anh-dung.nguyen@aalto.fi" }]
dependencies = [
    "pyyaml>=6.0.2",
    "pymavlink>=2.4.42",
    "jinja2>=3.1.6",
    "pydantic>=2.11.9",
]
readme = "README.md"
requires-python = ">= 3.9"

[tool.rye]
dev-dependencies = []
managed = true
virtual = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.rye.workspace]
members = [
  "src/sagely/*",
  "src/sagely/policy_controlplane/*",
  # "drone",

]

[tool.ruff]
# Keep ruff scoped to Python files. Ruff >= 0.17 also formats Python code
# blocks inside Markdown files by default, which is not wanted here.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pin the classic ruff default rule set (pycodestyle errors + pyflakes).
# This keeps `uvx ruff check .` stable across ruff versions; broaden the
# selection deliberately once the existing codebase is cleaned up.
select = ["E4", "E7", "E9", "F"]
