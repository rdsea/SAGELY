[project]
name = "holistic_policy"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "hong3nguyen", email = "tringuyennht@gmail.com" }]
dependencies = [
  # "tensorflow==2.17.0",
  # "tf2onnx==1.16.1",
  "pyyaml>=6.0.2",
  # "tensorflow==2.17.0",
  # "tf2onnx==1.16.1",
  # "etcd>=2.0.8",
  # "etcd3>=0.12.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
dev-dependencies = []
managed = true
virtual = true

[tool.hatch.metadata]
allow-direct-references = true


[tool.rye.workspace]
members = [
  "src/holistic_policy/context",
  "src/holistic_policy/service_discovery",
  "src/holistic_policy/policy_update",
  "drone",
  "applications/object_classification/src/*"
]
