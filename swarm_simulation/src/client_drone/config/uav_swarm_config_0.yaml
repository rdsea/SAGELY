# Envoy routes all HTTP to client_drone0:8080,
# but ROS2 container doesn’t expose an HTTP server on 8080 (your Python is a client + UDP listener).
# Unless really have an HTTP server there, Envoy will 503.
static_resources:
  listeners:
    - name: http
      address: { socket_address: { address: 0.0.0.0, port_value: 8000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http # required
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: drone_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      grpc_service:
                        envoy_grpc: { cluster_name: opa_ext_authz }
                      transport_api_version: V3
                  - name: envoy.filters.http.router # <-- keep the name
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router # <-- add this
  clusters:
    - name: drone_backend
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: drone_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address:
                        #{ address: client_drone0, port_value: 8080 },
                        { address: backend, port_value: 8080 } }
    - name: opa_ext_authz
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {} # <-- required for gRPC Envoy (HTTP/2)— Otherwise ext_authz gRPC can fail to connect.
      load_assignment:
        cluster_name: opa_ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    { socket_address: { address: opa0, port_value: 9191 } }
admin:
  access_log_path: /tmp/admin_access.log
  address: { socket_address: { address: 0.0.0.0, port_value: 8001 } }
